name: Code checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.po']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.po']

jobs:
  checks:
    if: github.repository == 'MikeSiLVO/service.trakt.relay'
    uses: MikeSiLVO/workflows/.github/workflows/checks.yml@v2.3.0
    with:
      deps: python-dateutil pytest
