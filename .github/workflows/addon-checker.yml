name: Kodi addon-checker

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.po']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.po']

jobs:
  addon-checker:
    if: github.repository == 'MikeSiLVO/service.trakt.relay'
    uses: MikeSiLVO/workflows/.github/workflows/addon-checker.yml@v2.3.0
    with:
      kodi_branch: omega
